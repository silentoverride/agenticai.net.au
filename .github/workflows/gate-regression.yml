name: Gate Regression Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/lib/server/assessment/gate/**'
      - 'src/lib/server/assessment/calibration/**'
      - '.scripts/test-gate-regression.ts'
      - '.scripts/gate-baseline.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/server/assessment/gate/**'
      - 'src/lib/server/assessment/calibration/**'
      - '.scripts/test-gate-regression.ts'
      - '.scripts/gate-baseline.json'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record gate baseline
        run: npx vitest run .scripts/test-gate-regression.ts -- --record
        env:
          NODE_ENV: test

      - name: Compare gate regression
        run: npx vitest run .scripts/test-gate-regression.ts -- --compare
        env:
          NODE_ENV: test
          GATE_REGRESSION_THRESHOLD: '0.8'

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-regression-report
          path: |
            .scripts/gate-baseline.json
