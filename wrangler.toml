name = "agenticai-net-au"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]
[[d1_databases]]
binding = "assessment_db"
database_name = "assessment-db"
database_id = "e497e4c9-7dd2-4fbf-a4ff-2c24899a4d83"
migrations_dir = "migrations"
[[r2_buckets]]
bucket_name = "assessment-blobs"
binding = "assessment_blobs"

[[queues.producers]]
binding = "assessment_queue"
queue = "assessment-jobs"

[vars]
# Gate mode: 'shadow' (default) or 'blocking'
GATE_MODE = "shadow"
GATE_MAX_RETRIES = "2"
GATE_QUICK_WINS_VERIFICATION_ENABLED = "true"
GATE_MAJOR_PROJECT_VERIFICATION_ENABLED = "true"
GATE_REPORT_REVIEW_ENABLED = "true"
GATE_QUICK_WINS_VERIFICATION_KILL = "false"
GATE_MAJOR_PROJECT_VERIFICATION_KILL = "false"
GATE_REPORT_REVIEW_KILL = "false"
